# 鸿蒙智行版 TeslaMate 栈（问界/智界）
#
# 与官方 compose 的区别：
#   * teslamate 从本地源码构建（包含 HimaApi 后端）
#   * VEHICLE_API_BACKEND=hima 选择鸿蒙智行后端
#   * 不需要 MQTT
#
# 首次使用：
#   1. 复制 .env.example 为 .env，填入 ENCRYPTION_KEY（随机 32 位十六进制）
#   2. docker compose -f docker-compose.hima.yml up -d --build
#   3. 打开 http://localhost:4000，Access Token 粘贴凭据包，Refresh Token 填 HIMA
#
# 凭据包由 hima-info 项目生成，一份凭据包对应一辆车。
services:
  teslamate-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=teslamate
      - POSTGRES_PASSWORD=${DATABASE_PASS:-teslamate}
      - POSTGRES_DB=teslamate
    volumes:
      - hima-teslamate-db:/var/lib/postgresql/data

  teslamate:
    build: .
    restart: unless-stopped
    depends_on:
      - teslamate-db
    environment:
      - DATABASE_USER=teslamate
      - DATABASE_PASS=${DATABASE_PASS:-teslamate}
      - DATABASE_NAME=teslamate
      - DATABASE_HOST=teslamate-db
      - VEHICLE_API_BACKEND=hima
      - DISABLE_MQTT=true
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?请先在 .env 中设置 ENCRYPTION_KEY}
      - TZ=${TZ:-Asia/Shanghai}
      - POLLING_ASLEEP_INTERVAL=${POLLING_ASLEEP_INTERVAL:-30}
      - POLLING_ONLINE_INTERVAL=${POLLING_ONLINE_INTERVAL:-30}
      # 行驶间隔不通过环境变量设置：上游 interval/2 只接受整数，
      # 而行驶默认值是 2.5 秒（浮点）。不设置该变量时使用代码默认值 2.5。
      - POLLING_CHARGING_INTERVAL=${POLLING_CHARGING_INTERVAL:-5}
      - POLLING_DEFAULT_INTERVAL=${POLLING_DEFAULT_INTERVAL:-15}
      - PORT=4000
    ports:
      - "4000:4000"
    volumes:
      - hima-teslamate-import:/opt/app/import

  grafana:
    image: teslamate/grafana:latest
    restart: unless-stopped
    depends_on:
      - teslamate-db
    environment:
      - DATABASE_USER=teslamate
      - DATABASE_PASS=${DATABASE_PASS:-teslamate}
      - DATABASE_NAME=teslamate
      - DATABASE_HOST=teslamate-db
    ports:
      - "3000:3000"
    volumes:
      - hima-grafana-data:/var/lib/grafana

volumes:
  hima-teslamate-db:
  hima-teslamate-import:
  hima-grafana-data:
